name: Build Android APK (Kivy/Buildozer)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      # Mantém tudo consistente (buildozer/p4a olham para essas vars)
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      # Evita downloads repetidos de algumas coisas
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python fixo (evita diferenças do /usr/bin/python3)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # sdkmanager (cmdline-tools) requer JDK 17+
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Instala/ajusta Android SDK + cmdline-tools + sdkmanager
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Dependências nativas para compilar python/kivy/p4a (mais completo)
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            build-essential ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            liblzma-dev libsqlite3-dev libgdbm-dev libgdbm-compat-dev \
            libbz2-dev libreadline-dev \
            libjpeg-dev libpng-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            ant

      # Cache do buildozer/p4a para acelerar e diminuir risco de falha em rebuild
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer + python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.36 buildozer python-for-android

      - name: Diagnostics (versions and paths)
        run: |
          echo "=== Python ==="
          which python
          python --version
          python -m pip --version
          echo "=== Java ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_SDK_ROOT" || true
          echo "sdkmanager location:"
          which sdkmanager || true
          sdkmanager --version || true
          echo "=== Buildozer ==="
          buildozer --version
          echo "=== p4a import ==="
          python -c "import pythonforandroid; print('python-for-android OK')"

      # Aceita licenças e instala exatamente os pacotes que evitam AIDL/build-tools missing
      - name: Accept licenses + install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # (Opcional) mostra o que instalou
      - name: List installed SDK packages
        run: |
          sdkmanager --list_installed || true
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      # Build (não uso clean para não quebrar cache; se quiser clean, adicione manualmente)
      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-apk
          path: |
            bin/*.apk
          if-no-files-found: error
