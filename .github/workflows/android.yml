name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            build-essential ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            liblzma-dev libsqlite3-dev libgdbm-dev libgdbm-compat-dev \
            libbz2-dev libreadline-dev \
            libjpeg-dev libpng-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            ant

      - name: Install Buildozer + python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36 buildozer python-for-android

      # ✅ ESTE PASSO RESOLVE O SEU ERRO
      - name: Accept Android SDK licenses + install build-tools
        run: |
          # garante paths usados pelo buildozer
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"
          export ANDROID_HOME="$ANDROIDSDK"

          mkdir -p "$ANDROIDSDK/cmdline-tools"
          # buildozer baixa cmdline-tools em "tools", linkamos para "latest" (sdkmanager espera)
          if [ -d "$ANDROIDSDK/tools" ] && [ ! -d "$ANDROIDSDK/cmdline-tools/latest" ]; then
            mv "$ANDROIDSDK/tools" "$ANDROIDSDK/cmdline-tools/latest"
          fi

          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$ANDROIDSDK/emulator:$PATH"

          yes | sdkmanager --licenses

          # instala o que o aidl precisa (build-tools)
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-apk
          path: bin/*.apk
