name: Build Android APK (Kivy/Buildozer)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (sdkmanager)
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            build-essential ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            liblzma-dev libsqlite3-dev libgdbm-dev libgdbm-compat-dev \
            libbz2-dev libreadline-dev \
            libjpeg-dev libpng-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            ant

      # Cache REAL que ajuda em buildozer/p4a (não depende de requirements/gradle)
      - name: Cache Buildozer (p4a/SDK downloads)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer + python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.36 buildozer python-for-android

      - name: Diagnostics
        run: |
          echo "=== Python ==="
          which python
          python --version
          echo "=== Java ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          echo "=== Buildozer ==="
          buildozer --version

      - name: Accept licenses + install required SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-apk
          path: bin/*.apk
          if-no-files-found: error
